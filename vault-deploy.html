<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allot · Deploy Vault v3 factory</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="allot.css?v=mono2">
<style>body{background-image:none!important}h1,h2{font-family:"Instrument Serif",Georgia,serif!important;font-weight:400!important}.card{border-radius:4px!important}.kv b{font:500 13px var(--mono)!important;overflow-wrap:anywhere}.tn{margin-top:18px;padding:10px 14px;border:1px dashed #ffb36b;border-radius:4px;font:600 12px var(--mono);letter-spacing:.08em;color:#ffb36b}</style>
<script>if(location.pathname.endsWith(".html"))history.replaceState(null,"",location.pathname.slice(0,-5)+location.search+location.hash)</script>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./"><span class="mark"></span>Allot</a><nav><a href="./">Home</a><a href="/app">App</a></nav><span class="acct" id="acct" hidden></span></div></header>
<main class="wrap">
  <div class="tn" id="net">…</div>
  <h1>Deploy the <em>Vault v3</em> factory.</h1>
  <p class="sub">One time, by the Allot team. The factory only deploys vaults and lists them; it keeps no control over any vault. Simulated first, signed in your own wallet.</p>
  <div class="card">
    <div class="kv"><div><small>NETWORK</small><b id="kNet">–</b></div><div><small>TOKEN</small><b id="kTok">–</b></div><div><small>TOKEN DOMAIN SEPARATOR</small><b id="kDs">–</b></div></div>
    <div class="row"><button class="go" id="deploy">Connect and deploy</button></div>
    <div class="log" id="log"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="allot.js?v=v2"></script>
<script>
(async () => {
  const A = ALLOT, E = A.E, $ = (i) => document.getElementById(i), say = (t) => ($("log").innerHTML += t + "\n");
  const { abi } = await A.load();
  $("net").textContent = A.NET === "testnet" ? "TESTNET · " + A.NAME.toUpperCase() + " · TEST USDG HAS NO VALUE" : "MAINNET · " + A.NAME.toUpperCase() + " · REAL USDG";
  $("kNet").textContent = A.NAME; $("kTok").textContent = A.USDG;
  // USDG's domain separator is read live. Test USDG has none: x402 cannot settle on testnet, direct payments and budgets still work.
  let ds = "0x" + "0".repeat(64);
  try { ds = (await A.read(A.USDG, "token", "DOMAIN_SEPARATOR"))[0]; } catch { if (A.NET !== "testnet") { $("kDs").textContent = "could not read it, stop"; $("deploy").disabled = true; return; } }
  $("kDs").textContent = ds + (A.NET === "testnet" && /^0x0+$/.test(ds) ? " (none on Test USDG)" : "");
  const fac = new E.ContractFactory(abi.factory, abi.factoryV3Bytecode), data = (await fac.getDeployTransaction(A.USDG, ds)).data;
  $("deploy").onclick = async () => { $("log").innerHTML = ""; try {
    const me = await A.connect(); $("acct").hidden = false; $("acct").textContent = A.short(me);
    say("· simulating on " + A.NAME + "…"); const [s] = await A.simulate(me, [{ data, gas: "0x1c9c380" }]); if (!s.ok) throw new Error("simulation says it would fail: " + s.why);
    say("✓ simulated · " + s.gas.toLocaleString("en-US") + " gas. Confirm in your wallet, check it says " + A.NAME + ".");
    const { hash, rc } = await A.send(me, { data }, s.gas);
    say(`✓ Vault v3 factory deployed at <b>${rc.contractAddress}</b> in block <b>${parseInt(rc.blockNumber, 16)}</b>\n  tx <a href="${A.EXP}/tx/${hash}" target="_blank" rel="noopener">${hash}</a>\nSend the address and block to the Allot team.`);
  } catch (e) { say("✗ " + (e.shortMessage || e.message || e)); } };
})();
</script>
</body>
</html>
